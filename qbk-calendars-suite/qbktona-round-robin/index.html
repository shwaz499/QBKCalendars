<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Round Robin Tournament Manager</title>
    <link rel="stylesheet" href="./styles.css?v=20260915-01" />
  </head>
  <body>
    <main class="app-shell">
      <section class="setup-view" id="setupView" aria-labelledby="setupTitle">
        <div class="setup-panel">
          <p class="eyebrow">QBK Tourney Creator</p>
          <h1 id="setupTitle">Build the tournament</h1>

          <label class="field-block" for="tournamentNameInput">
            <span>Tournament name</span>
            <input
              id="tournamentNameInput"
              type="text"
              autocomplete="off"
              placeholder="Friday Night Round Robin"
            />
          </label>

          <div class="setup-meta">
            <label class="field-block team-count-field" for="teamCountInput">
              <span>Number of teams</span>
              <input
                id="teamCountInput"
                type="number"
                min="3"
                max="8"
                step="1"
                inputmode="numeric"
              />
            </label>

            <label class="field-block team-count-field" for="matchesPerTeamInput">
              <span>Matchups per team</span>
              <input
                id="matchesPerTeamInput"
                type="number"
                min="1"
                max="7"
                step="1"
                inputmode="numeric"
              />
            </label>

            <label class="field-block team-count-field" for="gamesPerMatchInput">
              <span>Games per match</span>
              <input
                id="gamesPerMatchInput"
                type="number"
                min="1"
                max="3"
                step="1"
                inputmode="numeric"
              />
            </label>

            <label class="field-block team-count-field" for="playoffTeamCountInput">
              <span>Teams in playoffs</span>
              <input
                id="playoffTeamCountInput"
                type="number"
                min="2"
                max="8"
                step="1"
                inputmode="numeric"
              />
            </label>
          </div>

          <section class="teams-section" aria-label="Team names">
            <div class="section-heading">
              <h2>Teams</h2>
              <p id="setupStatus">Enter unique team names.</p>
            </div>
            <div class="team-grid" id="teamGrid"></div>
          </section>

          <div class="setup-actions">
            <button class="primary" id="generateBtn" type="button">Generate TV Page</button>
            <button class="secondary" id="viewTvBtn" type="button">Open TV Page</button>
            <button class="secondary" id="clearScoresBtn" type="button">Clear Scores</button>
          </div>
        </div>
      </section>

      <section class="tv-view" id="tvView" aria-label="Tournament TV page">
        <header class="tv-header">
          <div class="tv-tournament-name" id="tvTournamentName">Round Robin Tournament</div>
          <div class="tv-actions">
            <button class="secondary" id="generatePlayoffBtn" type="button">Generate Playoff</button>
            <button class="secondary" id="fullScreenBtn" type="button">Full Screen</button>
            <button class="secondary" id="backToSetupBtn" type="button">Edit Teams</button>
          </div>
        </header>

        <section class="tv-board">
          <section class="match-panel" aria-labelledby="matchTitle">
            <div class="panel-heading compact">
              <h2 id="matchTitle">Matchups</h2>
            </div>
            <div class="empty-state" id="emptyMatches">
              Set up the tournament first.
            </div>
            <div class="match-list" id="matchList" aria-live="polite"></div>
          </section>

          <aside class="standings-panel" aria-labelledby="standingsTitle">
            <div class="panel-heading compact">
              <h2 id="standingsTitle">Standings</h2>
            </div>
            <table class="standings-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Team</th>
                  <th>W</th>
                  <th>L</th>
                  <th>PF</th>
                  <th>PA</th>
                  <th>+/-</th>
                </tr>
              </thead>
              <tbody id="standingsBody"></tbody>
            </table>
            <div class="playoff-bracket" id="playoffBracket" hidden aria-live="polite"></div>
          </aside>
        </section>
      </section>
    </main>

    <dialog class="court-picker" id="courtPicker" aria-labelledby="courtPickerTitle">
      <form method="dialog">
        <h2 id="courtPickerTitle">Choose a court</h2>
        <div class="court-options">
          <button class="court-option" type="button" data-court="Left Court">LEFT</button>
          <button class="court-option" type="button" data-court="Middle Court">MIDDLE</button>
          <button class="court-option" type="button" data-court="Right Court">RIGHT</button>
        </div>
        <button class="secondary" type="submit">Cancel</button>
      </form>
    </dialog>

    <script src="./app.js?v=20260808-24"></script>
  </body>
</html>
